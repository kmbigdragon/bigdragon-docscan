# Release: pushing a tag vX.Y.Z (created by `npm version X.Y.Z`) builds and tests everything,
# then publishes a GitHub Release with the installable tarball and its SHA-256 checksum:
#   npm install https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/docscan-X.Y.Z.tgz
# Tags with a suffix (v0.3.0-rc.1) become pre-releases. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/release/check-tag.mjs "$GITHUB_REF_NAME"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the hand-written release notes are needed from the repository (docs/releases/<tag>.md).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
          path: source

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Checksums
        working-directory: package
        run: for file in *.tgz; do sha256sum "$file" > "$file.sha256"; done

      - name: Create the release
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          tarballs=(*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then echo "expected exactly one tarball, got ${#tarballs[@]}"; exit 1; fi
          tarball=${tarballs[0]}

          # Release notes: docs/releases/<tag>.md when it exists, otherwise just the install command.
          # GitHub's generated list of changes is appended either way.
          written="../source/docs/releases/$TAG.md"
          if [[ -f "$written" ]]; then
            cp "$written" ../notes.md
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$tarball"
            # shellcheck disable=SC2016 # the backticks are a literal Markdown code fence
            printf '## Cài đặt\n\n```bash\nnpm install %s\n```\n' "$url" > ../notes.md
          fi

          flags=(--title "docscan $TAG" --notes-file ../notes.md --generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$tarball" "$tarball.sha256" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

# Reusable build used by ci.yml and release.yml, so a release is built exactly like CI:
#   - native: C++ core + CLI + bench, GoogleTest suite (Linux, system OpenCV)
#   - wasm:   OpenCV + docscan for WebAssembly, TypeScript wrapper, JS tests, npm tarball,
#             smoke test of the tarball in a fresh project -> artifact "package"
name: build

on:
  workflow_call:

env:
  EMSDK_VERSION: "6.0.10" # keep in sync with the local toolchain (docs/RELEASING.md)
  NODE_VERSION: "24"

jobs:
  native:
    name: Native build + C++ tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libopencv-dev

      - name: Configure
        run: cmake --preset native-release

      - name: Build
        run: cmake --build --preset native-release

      - name: Test
        run: ctest --preset native-release

  wasm:
    name: WebAssembly build + JS tests + package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Put Emscripten on PATH
        run: |
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      # Building OpenCV for wasm is the slow part: reuse it until the toolchain or the build
      # script (which pins the OpenCV version and flags) changes.
      - name: Cache OpenCV for WebAssembly
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: third_party/opencv/wasm
          key: opencv-wasm-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build-opencv-wasm.mjs') }}

      - run: npm ci

      - name: Build OpenCV for WebAssembly
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: npm run opencv:wasm

      - name: Build docscan (wasm + TypeScript)
        run: npm run build

      - name: JS tests
        run: npm test

      - name: Pack
        id: pack
        run: echo "file=$(node scripts/release/pack.mjs)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the tarball in a fresh project
        run: npm run release:smoke -- "${{ steps.pack.outputs.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

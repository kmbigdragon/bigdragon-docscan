# Continuous integration: every push to main and every pull request is built and tested.
# The npm tarball of each run is kept as the "package" artifact (Actions -> run -> Artifacts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
